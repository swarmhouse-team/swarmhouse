services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: robots
      POSTGRES_PASSWORD: robots
      POSTGRES_DB: robots
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U robots -d robots']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    image: ${SWITCH_REGISTRY}/swarmhouse-api:${APP_VERSION:-v0.0.0}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      CACHE_DRIVER: memory
      CACHE_MEMORY_MAX_ENTRIES: '100'

  web:
    image: ${SWITCH_REGISTRY}/swarmhouse-web:${APP_VERSION:-v0.0.0}
